# AskFlow 前端站点配置
# 用法：复制到 /etc/nginx/conf.d/askflow.conf（或 sites-available 后 ln -s）
# 前置：前端 `npm run build` 产物已上传到 /var/www/askflow

server {
    listen       80;
    server_name  _;                     # 有域名就换成 example.com；没域名留 _

    root  /var/www/askflow;
    index index.html;

    # 后端 multipart 限制是 50MB/单文件、100MB/单请求，这里要 >= 后端的 100MB
    client_max_body_size 120m;

    # ---------- gzip ----------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/xml application/xml image/svg+xml;

    # ---------- SPA 前端路由 ----------
    # 前端用 createBrowserRouter（history 模式），刷新 /chat/xxx 这类地址
    # 必须回落到 index.html，否则 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 绝对不能被缓存，否则发版后用户还是旧的资源引用
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Vite 产物文件名带 hash，可以放心长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------- API 反向代理 ----------
    # 注意：proxy_pass 后面不要带 URI（不能写 /api/askflow/ 之类）
    # 后端 context-path 就是 /api/askflow，原样透传即可
    location /api/ {
        proxy_pass http://127.0.0.1:9090;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ↓↓↓ 对话是 SSE 流式输出（fetch + ReadableStream），这三行必须留着
        # 否则 Nginx 会把流缓存起来，用户看到的是"转很久然后整段文字一次性蹦出来"
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   Connection "";

        # 后端 rag.default.sse-timeout-ms = 300000（5 分钟），代理超时要大于它
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    # 调试用：确认反代是否通，直接 curl http://服务器IP/api/askflow/actuator/health
}
