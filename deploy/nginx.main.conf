# AskFlow 完整 Nginx 主配置（Alibaba Cloud Linux 3 / RHEL 系 nginx 通用）
#
# 用法：覆盖 /etc/nginx/nginx.conf
#   cp /etc/nginx/nginx.conf /etc/nginx/nginx.conf.bak
#   cp /tmp/nginx.main.conf /etc/nginx/nginx.conf
#   nginx -t && systemctl reload nginx
#
# 说明：RHEL 系默认 nginx.conf 内置了一个 listen 80 default_server 的欢迎页，
#      与本文件的 server 块抢 80 端口，所以这里直接整体替换，不再 include conf.d。

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # 后端 multipart 上限是 50MB/文件、100MB/请求，这里要 >= 100MB
    client_max_body_size 120m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/xml application/xml image/svg+xml;

    server {
        listen       80 default_server;
        listen       [::]:80 default_server;
        server_name  _;

        root  /var/www/askflow;
        index index.html;

        # SPA history 路由兜底（createBrowserRouter 必需）
        location / {
            try_files $uri $uri/ /index.html;
        }

        # index.html 不缓存，避免发版后用户仍引用旧资源
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires -1;
        }

        # Vite 产物文件名带 hash，可长缓存
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # API 反代：proxy_pass 后不要带 URI，后端 context-path 就是 /api/askflow
        location /api/ {
            proxy_pass http://127.0.0.1:9090;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE 流式输出必需，否则对话会"转很久然后整段蹦出"
            proxy_buffering    off;
            proxy_cache        off;
            proxy_set_header   Connection "";

            # 后端 sse-timeout-ms=300000，代理超时需大于它
            proxy_read_timeout 360s;
            proxy_send_timeout 360s;
        }
    }
}
